name: stahpwatch
options:
  bundleIdPrefix: com.jacobtehrani
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  stahpwatch:
    type: application
    platform: iOS
    sources:
      - stahpwatch
      - Shared
    dependencies:
      - target: LiveActivity
    info:
      path: stahpwatch/Info.plist
      properties:
        CFBundleDisplayName: stahpwatch
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).stahpwatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  LiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - LiveActivity
      - Shared
    info:
      path: LiveActivity/Info.plist
      properties:
        CFBundleDisplayName: stahpwatch
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).stahpwatch.LiveActivity
        GENERATE_INFOPLIST_FILE: NO
  stahpwatchTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - stahpwatchTests
    dependencies:
      - target: stahpwatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).stahpwatch.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  stahpwatch:
    build:
      targets:
        stahpwatch: all
    test:
      targets:
        - stahpwatchTests
